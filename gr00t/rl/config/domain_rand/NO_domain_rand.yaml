# @package _global_


defaults:
  - domain_rand_base

domain_rand:
  push_robots : False
  push_interval_s : [5, 10]
  max_push_vel_xy : 1.0

  wsdpt_push : False
  wsdpt_push_interval_s : [4, 6]
  wsdpt_palm_push_force_range : 10.0
  wsdpt_torso_push_force_range : 30.0

  randomize_friction : False
  # randomize_friction : False
  friction_range : [-0.6, 1.2]

  randomize_base_mass : False # replaced by randomize_link_mass
  added_mass_range : [-5., 10.]


  randomize_base_com : False
  base_com_range:
    x: [-0.1, 0.1]
    y: [-0.1, 0.1]
    z: [-0.01, 0.01]

  # DOF randomization settings (disabled by default)
  randomize_initial_dof_pos: false
  initial_dof_pos_range: [-0.1, 0.1]
  initial_dof_pos_distribution: "uniform"
  
  randomize_initial_dof_vel: false
  initial_dof_vel_range: [-0.5, 0.5]
  initial_dof_vel_distribution: "uniform"

  # DOF Position Randomization Curriculum (disabled by default)
  dof_pos_randomization_curriculum: false
  dof_pos_randomization_initial_range: [-0.02, 0.02]
  dof_pos_randomization_max_range: [-0.1, 0.1]
  dof_pos_randomization_min_range: [-0.005, 0.005]
  dof_pos_randomization_level_down_threshold: 200
  dof_pos_randomization_level_up_threshold: 400
  dof_pos_vel_randomization_curriculum_degree: 0.05
  
  # DOF Velocity Randomization Curriculum (disabled by default)  
  dof_vel_randomization_curriculum: false
  dof_vel_randomization_initial_range: [-0.1, 0.1]
  dof_vel_randomization_max_range: [-0.5, 0.5]
  dof_vel_randomization_min_range: [-0.02, 0.02]
  dof_vel_randomization_level_down_threshold: 200
  dof_vel_randomization_level_up_threshold: 400
  dof_vel_randomization_curriculum_degree: 0.05

  randomize_link_mass : False
  link_mass_range : [0.7, 1.3] # *factor
  randomize_link_body_names : [
      'pelvis', 'left_hip_yaw_link', 'left_hip_roll_link', 'left_hip_pitch_link', 'left_knee_link',
      'right_hip_yaw_link', 'right_hip_roll_link', 'right_hip_pitch_link', 'right_knee_link',
  ]

  randomize_pd_gain : False
  kp_range : [0.75, 1.25]
  kd_range : [0.75, 1.25]


  randomize_torque_rfi : False
  rfi_lim : 0.1
  randomize_rfi_lim : False
  rfi_lim_range : [0.5, 1.5]

  randomize_ctrl_delay : False
  ctrl_delay_step_range : [0, 2] # integer max real delay is 90ms

  randomize_init_pos : False
  init_pos_range_x : [-0.10, 0.10]
  init_pos_range_y : [-0.075, 0.075]
  init_pos_range_z : [-0.075, 0.075]

  randomize_motion_ref_xyz: False # head only for now
  motion_ref_xyz_range : [[-0.02, 0.02],[-0.02, 0.02],[-0.1, 0.1]]

  motion_package_loss: False
  package_loss_range: [1, 10] # dt = 0.02s, delay for 0.02s - 0.2s
  package_loss_interval_s : 2


  born_offset : False
  born_offset_curriculum: False
  born_offset_level_down_threshold: 50
  born_offset_level_up_threshold: 120
  level_degree: 0.00005
  born_distance : 0.25
  born_offset_range: [0.0, 1]
  born_offset_possibility : 1.0

  born_heading_curriculum: False
  born_heading_randomization : False
  born_heading_level_down_threshold: 50
  born_heading_level_up_threshold: 120
  born_heading_degree: 10
  born_heading_range: [0, 180]
  born_heading_level_degree: 0.00005


  # image data augmentation
  image_augmentation:
    # Whether to enable image augmentation
    enabled: False

    # Random brightness adjustment
    brightness:
      enabled: False 
      probability: 0.25
      range: [0.7, 2]

    # Random contrast adjustment
    contrast:
      enabled: False
      probability: 0.25
      range: [0.5, 1.5]

    # Random hue adjustment
    hue:
      enabled: False
      probability: 0.5
      range: [-0.1, 0.1]

    # Random saturation adjustment
    saturation:
      enabled: False
      probability: 0.25
      range: [0.5, 2]

    # Random Gaussian noise
    gaussian_noise:
      enabled: False
      probability: 0.25
      std_range: [0.0, 0.15]

    # Random blur
    gaussian_blur:
      enabled: False
      probability: 0.25
      kernel_size_range: [3, 5]
      sigma_range: [0.1, 1.5]

  # depth data augmentation
  depth_augmentation:
    # Whether to enable depth augmentation
    enabled: False

    # Depth value scaling/normalization
    depth_scaling:
      enabled: False
      probability: 0.3
      scale_range: [0.8, 1.2]  # Scale depth values by this factor

    # Depth noise injection
    depth_noise:
      enabled: False
      probability: 0.3
      # Gaussian noise
      gaussian_noise:
        enabled: True
        std_range: [0.001, 0.01]  # Standard deviation range for Gaussian noise
      # Perlin noise (for more realistic sensor noise)
      perlin_noise:
        enabled: False
        scale_range: [0.1, 0.5]  # Scale for Perlin noise
        amplitude_range: [0.001, 0.005]  # Amplitude of Perlin noise

    # Dropout/masking (simulate missing data)
    depth_dropout:
      enabled: False
      probability: 0.2
      # Random patches dropout
      patch_dropout:
        enabled: True
        num_patches_range: [1, 5]  # Number of patches to mask
        patch_size_range: [5, 15]  # Size of each patch (square)
      # Random pixel dropout
      pixel_dropout:
        enabled: False
        dropout_rate_range: [0.01, 0.05]  # Fraction of pixels to drop

    # Quantization (simulate lower resolution depth sensors)
    depth_quantization:
      enabled: False
      probability: 0.25
      # Number of depth levels (e.g., 256 for 8-bit, 64 for 6-bit)
      levels_range: [32, 256]


  randomize_dome_light : False
  dome_light_intensity_range : [800, 2000]
  dome_light_intensity_distribution : "uniform"
  dome_light_yaw_range : [-3.142, 3.142]
  dome_light_yaw_distribution : "uniform"
  dome_light_texture_folder_paths: []

  randomize_robot_material : False
  robot_material_roughness_range : [0.0, 0.8]
  robot_material_metallic_range : [0.0, 0.8]
  robot_material_specular_range : [0.0, 0.8]
  robot_material_distribution : "uniform"
  robot_material_shader_prim_paths : [
    "/World/envs/env_0/Robot/Looks/Rubber_Textured/Shader",
    "/World/envs/env_0/Robot/Looks/Marble_Tile_12/Shader",
  ]

  randomize_floor_material : False
  floor_material_folder_paths: []

  randomize_table_material : False
  table_material_folder_paths: []