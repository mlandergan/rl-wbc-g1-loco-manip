[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "move-garbage"
version = "0.1.0"
description = "G1 humanoid reinforcement-learning task for grasping and pushing a recycling bin"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
authors = [{name = "Move Garbage contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate==1.13.0",
    "datasets==5.0.1",
    "gymnasium==1.2.0",
    "hydra-core==1.3.2",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "loguru==0.7.3",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "pandas==3.0.5",
    "rich==15.0.0",
    "tensordict==0.12.4",
    "termcolor==3.3.0",
    "pyyaml==6.0.2",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers==5.12.1",
    "trl==0.17.0",
    "typing_extensions==4.12.2",
    "wandb==0.26.1",
]

[project.optional-dependencies]
export = [
    "onnx>=1.16",
]
visualization = [
    "matplotlib",
    "opencv-python",
    "plotly",
    "viser",
]
dev = [
    "pytest==7.4.0",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gr00t*", "move_garbage*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
gr00t = [
    "rl/config/**/*.yaml",
    "rl/data/**/*.usda",
    "rl/simulator/isaacsim/.isaacsim_version",
]
move_garbage = [
    "config/**/*.yaml",
    "data/**/*",
    "checkpoints/*.yaml",
    "checkpoints/*.pt",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

